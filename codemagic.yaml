workflows:
  android-workflow:
    name: Build Mahmoud ERP APK
    max_build_duration: 15
    instance_type: linux_x2
    scripts:
      - name: Install Flet Tool
        script: |
          pip install flet
      - name: Run Mahmoud Build Script
        script: |
          flet build apk --product "mahmoud" --release
    artifacts:
      - build/apk/*.apk
    publishing:
      email:
        recipients:
          - mahmuodnassni@gmail.com

