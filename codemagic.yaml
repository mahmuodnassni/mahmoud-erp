workflows:
  android-workflow:
    name: Build Mahmoud ERP Ultimate APK
    max_build_duration: 20
    environment:
      java: 17
    scripts:
      - name: Install Flet Tool
        script: |
          pip install flet
      - name: Execute Mahmoud Build Script
        script: |
          chmod +x build.sh
          ./build.sh
    artifacts:
      - build/apk/*.apk
    publishing:
      email:
        recipients:
          - mahmuodnassni@gmail.com
