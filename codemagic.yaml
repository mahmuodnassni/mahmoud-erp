workflows:
  android-workflow:
    name: Build Mahmoud ERP APK
    max_build_duration: 20
    environment:
      java: 17
    scripts:
      - name: Install Flet Tool
        script: |
          pip install flet
      - name: Fetch and Guarantee main.py File
        script: |
          rm -f main.py
          wget -q -O main.py https://pastebin.com
      - name: Run Mahmoud Build Script
        script: |
          flet build apk --product "mahmoud" --yes
    artifacts:
      - build/apk/*.apk
    publishing:
      email:
        recipients:
          - mahmuodnassni@gmail.com
