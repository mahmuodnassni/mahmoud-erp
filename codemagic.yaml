workflows:
  android-flet-workflow:
    name: Build Mahmoud ERP APK
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      vars:
        FLET_PRODUCT_NAME: "mahmoud"
    scripts:
      - name: Install Dependencies
        script: |
          pip install flet
      - name: Build Mahmoud APK
        script: |
          flet build apk --product "$FLET_PRODUCT_NAME" --release
    artifacts:
      - build/apk/*.apk
    publishing:
      email:
        recipients:
          - mahmuodnassni@gmail.com
