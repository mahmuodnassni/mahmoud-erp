import flet as ft
import sqlite3
from datetime import datetime

def main(page: ft.Page):
    page.title = "mahmoud ERP - Amin Core"
    page.theme_mode = ft.ThemeMode.DARK
    page.rtl = True
    page.scroll = ft.ScrollMode.AUTO
    db_path = "amin_core_local.db"

    conn = sqlite3.connect(db_path)
    cursor = conn.cursor()
    cursor.execute("CREATE TABLE IF NOT EXISTS accounts (acc_number INTEGER PRIMARY KEY, acc_name TEXT UNIQUE, acc_type TEXT)")
    cursor.execute("CREATE TABLE IF NOT EXISTS journal_entries (id INTEGER PRIMARY KEY AUTOINCREMENT, date TEXT, debit_acc TEXT, credit_acc TEXT, amount REAL, statement TEXT)")
    
    cursor.executemany("INSERT OR IGNORE INTO accounts (acc_number, acc_name, acc_type) VALUES (?, ?, ?)", [
        (1000, "الصندوق الرئيسي", "أصول متداولة"),
        (1100, "المستودع العام", "أصول متداولة"),
        (2000, "حساب المبيعات", "إيرادات"),
        (3000, "حساب المشتريات", "مصاريف"),
        (4000, "حساب رأس المال", "حقوق ملكية")
    ])
    conn.commit()
    conn.close()

    drop_debit = ft.Dropdown(label="من حساب (المدين / المستلم)")
    drop_credit = ft.Dropdown(label="إلى حساب (الدائن / الدافع)")
    txt_amount = ft.TextField(label="المبلغ المالي الصارم", keyboard_type=ft.KeyboardType.NUMBER)
    txt_statement = ft.TextField(label="البيان / شرح القيد المحاسبي")
    
    lv_tree = ft.ListView(expand=True, spacing=5, height=120)
    lv_ledger = ft.ListView(expand=True, spacing=5, height=200)

    def refresh_amin_core():
        drop_debit.options.clear()
        drop_credit.options.clear()
        lv_tree.controls.clear()
        lv_ledger.controls.clear()
        
        db = sqlite3.connect(db_path)
        cur = db.cursor()
        cur.execute("SELECT acc_number, acc_name, acc_type FROM accounts ORDER BY acc_number ASC")
        for num, name, a_type in cur.fetchall():
            drop_debit.options.append(ft.dropdown.Option(name))
            drop_credit.options.append(ft.dropdown.Option(name))
            lv_tree.controls.append(ft.Container(content=ft.Text(f" [{num}] - {name} ({a_type})"), bgcolor="bluegrey800", padding=5, border_radius=5))
            
        cur.execute("SELECT date, debit_acc, credit_acc, amount, statement FROM journal_entries ORDER BY id DESC")
        for dt, deb, cred, amt, stat in cur.fetchall():
            lv_ledger.controls.append(
                ft.Container(
                    content=ft.Column([
                        ft.Text(f"قيد متوازن بتاريخ: {dt} | الشرح: {stat if stat else ''}", size=11, color="grey"),
                        ft.Row([
                            ft.Text(f" مَدين (من حـ/): {deb}", color="green200", weight="bold"),
                            ft.Text(f" دائن (إلى حـ/): {cred}", color="red200", weight="bold"),
                            ft.Text(f"المبلغ: {amt:,.2f}", color="amber", weight="bold")
                        ], alignment=ft.MainAxisAlignment.SPACE_BETWEEN)
                    ]), bgcolor="bluegrey900", border_radius=8, padding=10
                )
            )
        db.close()
        page.update()

    def commit_double_entry(e):
        if not drop_debit.value or not drop_credit.value or not txt_amount.value: return
        if drop_debit.value == drop_credit.value: return
        try: amt = float(txt_amount.value.strip())
        except: return
        
        now = datetime.now().strftime("%Y-%m-%d %H:%M")
        db = sqlite3.connect(db_path)
        cur = db.cursor()
        cur.execute("INSERT INTO journal_entries (date, debit_acc, credit_acc, amount, statement) VALUES (?, ?, ?, ?, ?)",
                    (now, drop_debit.value, drop_credit.value, amt, txt_statement.value.strip()))
        db.commit()
        db.close()
        txt_amount.value = ""
        txt_statement.value = ""
        refresh_amin_core()

    page.add(
        ft.Container(content=ft.Column([ft.Text("🏛️ شجرة الحسابات ودليل الأمين:", weight="bold"), lv_tree]), bgcolor="bluegrey", padding=15, border_radius=12),
        ft.Container(height=10),
        ft.Text("✏️ ترحيل قيد مزدوج متوازن (مدين / دائن):", weight="bold", color="blue"),
        drop_debit, drop_credit, txt_amount, txt_statement,
        ft.ElevatedButton("ترحيل القيد المزدوج لدفتر الأستاذ", on_click=commit_double_entry, bgcolor="blue", color="white"),
        ft.Divider(),
        ft.Text("📑 دفتر اليومية والقيود الموزونة:", weight="bold"),
        lv_ledger
    )
    refresh_amin_core()

ft.app(target=main)
